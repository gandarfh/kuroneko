name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run: builds and packages the app but publishes nothing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the app
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compute the release version
        id: version
        # A dry run has no tag to read a version from.
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # One certificate of the project signs every release: macOS ties the
      # mic, system audio, screen and Automation permissions to it, so they
      # survive updates on every Mac. Without the secrets (a fork) the build
      # is signed ad hoc, as before. See scripts/signing-cert.sh.
      - name: Import the signing certificate
        id: signing
        env:
          P12: ${{ secrets.KURONEKO_SIGNING_P12 }}
          PASSWORD: ${{ secrets.KURONEKO_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "identity=Kuroneko Release Signing" >> "$GITHUB_OUTPUT"

      - name: Build the app bundle
        run: make bundle SIGN_IDENTITY="${{ steps.signing.outputs.identity }}" VERSION="${{ steps.version.outputs.version }}" BUILD_NUMBER="${{ github.run_number }}"

      - name: Show the signature
        run: |
          codesign -dvv dist/Kuroneko.app 2>&1 | grep -E "^(Authority|Signature|Identifier)=" || true
          codesign -d -r- dist/Kuroneko.app

      - name: Package the release archive
        run: |
          set -euo pipefail
          asset="Kuroneko-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --keepParent dist/Kuroneko.app "$asset"
          shasum -a 256 "$asset" > SHA256SUMS
          cp scripts/install.sh install.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            Kuroneko-*.zip
            SHA256SUMS
            install.sh
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Publishing only ever happens for a tag; a dry run stops after build.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release
          path: dist

      # The installer ships with each release, so the "latest" link always
      # serves the script that matches the latest build.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          body: |
            Instalar ou atualizar:

            ```sh
            curl -fsSL https://github.com/gandarfh/kuroneko/releases/latest/download/install.sh | sh
            ```
          files: |
            dist/Kuroneko-*.zip
            dist/SHA256SUMS
            dist/install.sh
